name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Only newer runs of this workflow for the same PR supersede older work.
# Non-PR runs have unique keys, preserving every main/manual/scheduled run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-xvfb
        pip install -e .
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr xvfb
    
    - name: Test with unittest
      run: |
        xvfb-run --auto-servernum python -m unittest test_textract.py